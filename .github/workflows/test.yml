name: Test CI

on: [push, pull_request]

env:
  qemu-version: 9.2.4
  rust-toolchain: nightly-2025-05-20
  arceos-apps: 'bcbbcb9'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust-toolchain }}
    - name: Run unit tests
      run: make unittest_no_fail_fast
    - name: Check C allocation failure paths
      run: sh ulib/axlibc/tests/alloc_oom/run_c_stdlib_tests.sh

  allocation-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        allocator: [tlsf, buddy, slab]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust-toolchain }}
    - name: Check allocation failure and recovery
      run: |
        cargo test -p axalloc --no-default-features --features ${{ matrix.allocator }},axallocator/page-alloc-256m
        python3 ulib/axlibc/tests/alloc_oom/run.py --allocator ${{ matrix.allocator }}
        python3 ulib/axlibc/tests/alloc_oom/run.py --allocator ${{ matrix.allocator }} --release

  app-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64, riscv64, aarch64, loongarch64, arm]
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-05-20
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust-toolchain }}
        components: rust-src, llvm-tools
        targets: x86_64-unknown-none, riscv64gc-unknown-none-elf, aarch64-unknown-none-softfloat, loongarch64-unknown-none-softfloat, armv7a-none-eabi
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: cargo-bin-cache-${{ env.rust-toolchain }}
        cache-targets: false
    - uses: arceos-org/setup-qemu@v1
      with:
        version: ${{ env.qemu-version }}
        arch_list: x86_64,aarch64,riscv64,loongarch64,arm
    - uses: arceos-org/setup-musl@v1.0.3
      with:
        arch: ${{ matrix.arch }}
    - name: Check C allocation failure on QEMU
      timeout-minutes: 15
      if: matrix.arch == 'x86_64'
      shell: bash
      run: |
        cases=(valid-layout-1GiB SIZE_MAX PTRDIFF_MAX)
        for case in 0 1 2; do
          make_args=(A=examples/malloc-oom-c ARCH=x86_64 MEM=128M ACCEL=n
                     APP_CFLAGS=-DMALLOC_OOM_CASE=$case)
          make "${make_args[@]}" -W examples/malloc-oom-c/main.c
          timeout 120s make "${make_args[@]}" run | tee "malloc-oom-$case.log"
          grep -Fq "malloc-oom: PASS ${cases[$case]}" "malloc-oom-$case.log"
        done
    - name: Run app tests
      run: |
        make disk_img
        git clone https://github.com/arceos-org/arceos-apps.git
        cd arceos-apps && git reset --hard ${{ env.arceos-apps }} && cd ..
        make -C arceos-apps chaxroot AX_ROOT=$(pwd)
        make -C arceos-apps test ARCH=${{ matrix.arch }}
