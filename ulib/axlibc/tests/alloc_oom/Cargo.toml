[package]
name = "arceos-oom-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["tlsf"]
tlsf = ["axalloc/tlsf"]
buddy = ["axalloc/buddy"]
slab = ["axalloc/slab"]

[dependencies]
# The bitmap's base is rounded down to 1 GiB. A larger bitmap accommodates
# arbitrary host addresses; the probe's actual heap is still only 256 KiB.
axalloc = { path = "../../../../modules/axalloc", default-features = false, features = ["page-alloc-4g"] }
axallocator = "0.2.0"
axerrno = "0.1"

[workspace]
